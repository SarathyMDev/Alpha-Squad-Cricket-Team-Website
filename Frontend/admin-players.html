
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Players</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .admin-players {
            max-width: 1100px;
            margin: 30px auto;
        }

        .player-form, .player-list {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .player-form input, .player-form select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .player-form button, .player-list button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 4px;
        }

        .save-btn {
            background: #0b1f3a;
            color: white;
        }

        .cancel-btn {
            background: #64748b;
            color: white;
        }

        .edit-btn {
            background: #2563eb;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #0b1f3a;
            color: white;
        }

        #statusMessage {
            margin-top: 12px;
            font-weight: bold;
        }

        #photoPreview {
            display: none;
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            margin: 10px 0 15px;
        }
    </style>
</head>

<body>

<main class="admin-players">

    <h1>Manage Cricket Players</h1>
    <p><a href="admin-dashboard.html">← Back to Dashboard</a></p>

    <section class="player-form">

        <h2 id="formTitle">Add New Player</h2>

        <form id="playerForm">

            <input type="hidden" id="playerId">

            <label for="name">Player Name</label>
            <input type="text" id="name" required>

            <label for="role">Player Role</label>
            <select id="role" required>
                <option value="">Select Role</option>
                <option value="Batsman">Batsman</option>
                <option value="Bowler">Bowler</option>
                <option value="All Rounder">All Rounder</option>
                <option value="Wicket Keeper">Wicket Keeper</option>
            </select>

            <label for="jerseyNumber">Jersey Number</label>
            <input type="number" id="jerseyNumber" min="1" required>

            <label for="battingStyle">Batting Style</label>
            <input type="text" id="battingStyle"
                   placeholder="Example: Right Hand">

            <label for="bowlingStyle">Bowling Style</label>
            <input type="text" id="bowlingStyle"
                   placeholder="Example: Right Arm Fast">

            <!-- Player profile photo -->
            <label for="playerPhoto">Player Profile Photo</label>
            <input type="file" id="playerPhoto" accept="image/*">

            <img id="photoPreview" alt="Player photo preview">

            <button type="submit" class="save-btn" id="saveButton">
                Add Player
            </button>

            <button type="button" class="cancel-btn"
                    id="cancelButton" hidden>
                Cancel Edit
            </button>

        </form>

        <p id="statusMessage" aria-live="polite"></p>

    </section>

    <section class="player-list">

        <h2>Existing Players</h2>

        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Photo</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Jersey</th>
                        <th>Batting</th>
                        <th>Bowling</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="playersTableBody">
                    <tr>
                        <td colspan="8">Loading players...</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </section>

</main>

<script src="js/admin-players.js"></script>

</body>
</html>
