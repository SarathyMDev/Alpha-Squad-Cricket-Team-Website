
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Squad | Contact Messages</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #0b1f38;
        }

        .admin-header {
            background: #0b1f38;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #dcae3f;
        }

        .admin-header h1 {
            color: #dcae3f;
            font-size: 22px;
            margin: 0;
        }

        .back-btn {
            color: #dcae3f;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .summary-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            min-width: 150px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .summary-card p {
            color: #64748b;
            margin: 0 0 10px;
        }

        .summary-card h2 {
            margin: 0;
            font-size: 28px;
        }

        #statusMessage {
            margin: 15px 0;
            font-weight: bold;
        }

        .message-card {
            background: white;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 10px;
            border-left: 5px solid #dcae3f;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .message-card.unread {
            border-left-color: #2563eb;
        }

        .message-top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .message-top h3 {
            margin: 0 0 10px;
        }

        .message-details {
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
        }

        .message-content {
            margin-top: 15px;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .status {
            font-size: 12px;
            font-weight: bold;
            color: #2563eb;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .read-btn {
            background: #0b1f38;
            color: #dcae3f;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .empty {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 10px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .admin-header {
                padding: 15px;
            }

            .container {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

<header class="admin-header">
    <h1>📩 CONTACT MESSAGES</h1>
    <a class="back-btn" href="admin-dashboard.html">
        ← Dashboard
    </a>
</header>

<main class="container">

    <h2>Customer Enquiries</h2>
    <p>View and manage messages submitted through your website.</p>

    <section class="summary">
        <div class="summary-card">
            <p>Total Messages</p>
            <h2 id="totalMessages">0</h2>
        </div>

        <div class="summary-card">
            <p>Unread Messages</p>
            <h2 id="unreadMessages">0</h2>
        </div>
    </section>

    <p id="statusMessage">Loading messages...</p>

    <section id="messagesContainer"></section>

</main>

<script>
  const API_URL = "https://alpha-squad-cricket-team-website.onrender.com/api/contact";

    const messagesContainer =
        document.getElementById("messagesContainer");

    const statusMessage =
        document.getElementById("statusMessage");

    let messages = [];

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    async function loadMessages() {
        statusMessage.textContent = "Loading messages...";

        try {
            const response = await fetch(API_URL, {
                method: "GET",
                credentials: "include"
            });

            if (response.status === 401 || response.status === 403) {
                throw new Error(
                    "Your admin session is missing or expired. Please log in again."
                );
            }

            if (!response.ok) {
                throw new Error("Unable to load contact messages.");
            }

            messages = await response.json();

            displayMessages();
            statusMessage.textContent = "";

        } catch (error) {
            messagesContainer.innerHTML = "";
            statusMessage.textContent = error.message;
            statusMessage.style.color = "red";
        }
    }

    function displayMessages() {
        const unread = messages.filter(message => !message.read).length;

        document.getElementById("totalMessages").textContent =
            messages.length;

        document.getElementById("unreadMessages").textContent =
            unread;

        if (messages.length === 0) {
            messagesContainer.innerHTML =
                '<div class="empty">No contact messages found.</div>';
            return;
        }

        messagesContainer.innerHTML = messages.map(message => `
            <article class="message-card ${message.read ? "" : "unread"}">

                <div class="message-top">
                    <div>
                        <h3>${escapeHTML(message.name)}</h3>

                        <div class="message-details">
                            Email: ${escapeHTML(message.email)}<br>
                            Subject: ${escapeHTML(message.subject || "No subject")}
                        </div>
                    </div>

                    <span class="status">
                        ${message.read ? "READ" : "UNREAD"}
                    </span>
                </div>

                <div class="message-content">
                    ${escapeHTML(message.message)}
                </div>

                <div class="actions">
                    ${
                        message.read
                        ? ""
                        : `<button class="read-btn"
                            data-action="read"
                            data-id="${Number(message.messageId)}">
                            Mark as Read
                           </button>`
                    }

                    <button class="delete-btn"
                        data-action="delete"
                        data-id="${Number(message.messageId)}">
                        Delete
                    </button>
                </div>

            </article>
        `).join("");
    }

    messagesContainer.addEventListener("click", async function(event) {
        const button = event.target.closest("button[data-action]");

        if (!button) return;

        const id = Number(button.dataset.id);
        const action = button.dataset.action;

        try {
            button.disabled = true;

            let response;

            if (action === "read") {
                response = await fetch(`${API_URL}/${id}/read`, {
                    method: "PUT",
                    credentials: "include"
                });
            }

            if (action === "delete") {
                if (!confirm("Are you sure you want to delete this message?")) {
                    button.disabled = false;
                    return;
                }

                response = await fetch(`${API_URL}/${id}`, {
                    method: "DELETE",
                    credentials: "include"
                });
            }

            if (response.status === 401 || response.status === 403) {
                throw new Error(
                    "Your admin session is missing or expired. Please log in again."
                );
            }

            if (!response.ok) {
                throw new Error("The requested action could not be completed.");
            }

            await loadMessages();

        } catch (error) {
            alert(error.message);
            button.disabled = false;
        }
    });

    loadMessages();
</script>

</body>
</html>
